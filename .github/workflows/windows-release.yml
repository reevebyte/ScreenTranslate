name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.9"
      - name: Validate release identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne "reevebyte/ScreenTranslate") {
            throw "Native updates are pinned to reevebyte/ScreenTranslate; refusing to publish from $env:GITHUB_REPOSITORY"
          }

          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          python release/check_version.py --expected $releaseVersion
          if ($LASTEXITCODE -ne 0) { throw "Source version does not match release tag" }

          $releaseChannel = "stable"
          $numericVersion = "$releaseVersion.0"

          "RELEASE_VERSION=$releaseVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NUMERIC_VERSION=$numericVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHANNEL=$releaseChannel" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=ScreenTranslate-$releaseVersion-windows-x64.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_NAME=ScreenTranslate-$releaseVersion-setup-x64.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native release
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-native.ps1
          -Configuration Release
          -Architecture x64
          -UpdateChannel $env:RELEASE_CHANNEL
          -RunSmokeTest
      - name: Validate native release binary
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\release\check_native_binary.ps1
          -Path .\build\native\Release\ScreenTranslate.exe
          -ExpectedVersion $env:RELEASE_VERSION
      - name: Install locked Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=$env:INNO_SETUP_VERSION --allow-downgrade --no-progress --require-checksums -y
      - name: Compile native installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe was not installed" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DAppNumericVersion=$env:RELEASE_NUMERIC_VERSION" installer/ScreenTranslate.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Stage portable executable and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath build/native/Release/ScreenTranslate.exe -Destination "dist/$env:PORTABLE_NAME"
          Copy-Item -LiteralPath LICENSE -Destination dist/LICENSE.txt
          Copy-Item -LiteralPath native/THIRD_PARTY_NOTICES.txt -Destination dist/THIRD_PARTY_NOTICES.txt
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$env:SETUP_NAME"
          python release/generate_manifest.py --artifact "dist/$env:SETUP_NAME" --version $env:RELEASE_VERSION --download-url $downloadUrl --channel $env:RELEASE_CHANNEL --output dist/update-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "Update manifest generation failed" }
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenTranslate-${{ github.ref_name }}-windows-x64
          path: |
            dist/ScreenTranslate-*-windows-x64.exe
            dist/ScreenTranslate-*-setup-x64.exe
            dist/update-manifest.json
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreenTranslate-${{ github.ref_name }}-windows-x64
          path: dist
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          portable="ScreenTranslate-${version}-windows-x64.exe"
          setup="ScreenTranslate-${version}-setup-x64.exe"
          arguments=(
            release create "$GITHUB_REF_NAME"
            "dist/$portable" "dist/$setup" "dist/update-manifest.json"
            "dist/LICENSE.txt" "dist/THIRD_PARTY_NOTICES.txt"
            --verify-tag --generate-notes --title "ScreenTranslate $GITHUB_REF_NAME"
          )
          gh "${arguments[@]}"
