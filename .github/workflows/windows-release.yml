name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-audit.lock
      - name: Install locked toolchain
        shell: pwsh
        run: |
          python -m pip install pip==26.1.2
          python -m pip install -r requirements-audit.lock
          python -m pip check
      - name: Audit locked dependencies
        shell: pwsh
        run: |
          foreach ($lockFile in @("requirements.lock", "requirements-rapidocr.lock")) {
            $passed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              python -m pip_audit -r $lockFile --disable-pip --no-deps --cache-dir .pip-audit-cache
              $auditExit = $LASTEXITCODE
              if ($auditExit -eq 0) {
                $passed = $true
                break
              }
              if ($attempt -lt 3) {
                Write-Warning "pip-audit failed for $lockFile (attempt $attempt/3); retrying"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $passed) { exit $auditExit }
          }
      - name: Validate and test
        shell: pwsh
        run: |
          python release/check_environment.py --strict-lock
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          python release/check_version.py --expected $releaseVersion
          python -m unittest discover -s tests -p "test_*.py" -v
          $versionWithoutBuild = ($releaseVersion -split '\+')[0]
          $isPrerelease = $versionWithoutBuild.Contains('-')
          $releaseChannel = if ($isPrerelease) { "preview" } else { "stable" }
          $numericVersion = ($releaseVersion -split '[-+]')[0] + ".0"
          "RELEASE_VERSION=$releaseVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NUMERIC_VERSION=$numericVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHANNEL=$releaseChannel" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCREENTRANS_UPDATE_CHANNEL=$releaseChannel" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PORTABLE_NAME=ScreenTranslate-$releaseVersion-windows-x64.zip" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_NAME=ScreenTranslate-$releaseVersion-setup-x64.exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        run: python build.py
      - name: Validate embedded update source
        shell: pwsh
        run: |
          python release/check_update_source.py `
            --source dist/ScreenTranslate/_internal/screentrans-update-source.json `
            --repository $env:GITHUB_REPOSITORY `
            --channel $env:RELEASE_CHANNEL
      - name: Run packaged offline self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: dist/ScreenTranslate/ScreenTranslate.exe --selftest --quiet --offline
      - name: Install locked Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=$env:INNO_SETUP_VERSION --allow-downgrade --no-progress --require-checksums -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe was not installed" }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "/DAppNumericVersion=$env:RELEASE_NUMERIC_VERSION" installer/ScreenTranslate.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Package portable build and generate update manifest
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ScreenTranslate -DestinationPath "dist/$env:PORTABLE_NAME" -CompressionLevel Optimal
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$env:SETUP_NAME"
          python release/generate_manifest.py --artifact "dist/$env:SETUP_NAME" --version $env:RELEASE_VERSION --download-url $downloadUrl --channel $env:RELEASE_CHANNEL --output dist/update-manifest.json
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenTranslate-${{ github.ref_name }}-windows-x64
          path: |
            dist/ScreenTranslate-*-windows-x64.zip
            dist/ScreenTranslate-*-setup-x64.exe
            dist/update-manifest.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreenTranslate-${{ github.ref_name }}-windows-x64
          path: dist
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          portable="ScreenTranslate-${version}-windows-x64.zip"
          setup="ScreenTranslate-${version}-setup-x64.exe"
          arguments=(
            release create "$GITHUB_REF_NAME"
            "dist/$portable" "dist/$setup" "dist/update-manifest.json"
            --verify-tag --generate-notes --title "ScreenTranslate $GITHUB_REF_NAME"
          )
          if [[ "$version" == *-* ]]; then arguments+=(--prerelease); fi
          gh "${arguments[@]}"
