name: ScreenTranslate draft release

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v2 tag to build (for example v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: v2-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      signed_updates: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-v2-version.mjs
      - id: signing
        name: Select signed updater or ordinary release
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.SCREENTRANS_UPDATE_PUBLIC_KEY }}
        run: |
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then UPDATE_PUBLIC_KEY="$(cat apps/desktop/src-tauri/updater.pub)"; fi
          if [[ -n "$UPDATE_PRIVATE_KEY" && -n "$UPDATE_PUBLIC_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$UPDATE_PRIVATE_KEY" ]]; then
            echo 'A signing private key requires the matching public key'
            exit 1
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - id: release
        name: Prepare reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json 2>/dev/null; then
            test "$(jq -r .draft release.json)" = true || { echo 'Refusing to change a published release'; exit 1; }
          else
            args=(--draft --title "ScreenTranslate $RELEASE_TAG" --notes-file docs/v2-release-notes.md)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          fi
          echo "id=$(jq -r .id release.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SCREENTRANS_UPDATE_PUBLIC_KEY: ${{ vars.SCREENTRANS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libpipewire-0.3-dev libclang-dev libgbm-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm types:check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ needs.prepare.outputs.signed_updates == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }}
          includeUpdaterJson: ${{ needs.prepare.outputs.signed_updates == 'true' }}
          updaterJsonPreferNsis: true
  manifests:
    if: needs.prepare.outputs.signed_updates == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and write signed update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir build/v2-release
          node scripts/v2-release-manifests.mjs build/v2-release
          gh release upload "$RELEASE_TAG" build/v2-release/latest-v2.json LICENSE docs/v2-third-party-notices.txt --clobber
