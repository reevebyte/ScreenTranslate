name: ScreenTranslate draft release

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v2 tag to build (for example v2.0.0)'
        required: true
        type: string
      finish_only:
        description: 'Only finish update metadata using the existing uploaded installers'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: v2-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      signed_updates: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-v2-version.mjs
      - id: signing
        name: Select signed updater or ordinary release
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.SCREENTRANS_UPDATE_PUBLIC_KEY }}
          FINISH_ONLY: ${{ inputs.finish_only }}
        run: |
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then UPDATE_PUBLIC_KEY="$(cat apps/desktop/src-tauri/updater.pub)"; fi
          if [[ "$FINISH_ONLY" == 'true' ]]; then
            test -n "$UPDATE_PUBLIC_KEY" || { echo 'Finishing signed metadata requires the public key'; exit 1; }
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$UPDATE_PRIVATE_KEY" && -n "$UPDATE_PUBLIC_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$UPDATE_PRIVATE_KEY" ]]; then
            echo 'A signing private key requires the matching public key'
            exit 1
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - id: release
        name: Prepare reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'RELEASE_SCRIPT'
          import { readFile, writeFile, appendFile } from 'node:fs/promises';
          const { GITHUB_REPOSITORY: repository, RELEASE_TAG: tag, GH_TOKEN: token, GITHUB_OUTPUT: output } = process.env;
          if (!repository || !token || !output || !/^v2\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '')) throw new Error('Invalid release environment');
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'ScreenTranslate-release', 'Content-Type': 'application/json' };
          async function request(path, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}) });
            if (!response.ok) throw new Error(`Release API ${method} failed: HTTP ${response.status}`);
            return response.json();
          }
          // The by-tag endpoint does not reliably return unpublished drafts.
          // List authenticated releases, and retain the POST response when creating one.
          let release;
          for (let page = 1; ; page++) {
            const releases = await request(`/releases?per_page=100&page=${page}`);
            const matches = releases.filter(item => item.tag_name === tag);
            if (matches.length > 1) throw new Error('Duplicate release drafts require review');
            if (matches.length) { release = matches[0]; break; }
            if (releases.length < 100) break;
          }
          if (release && !release.draft) throw new Error('Refusing to change a published release');
          if (!release) release = await request('/releases', 'POST', {
            tag_name: tag, name: `ScreenTranslate ${tag}`, draft: true, prerelease: tag.includes('-'),
            body: await readFile('docs/v2-release-notes.md', 'utf8'),
          });
          if (!Number.isSafeInteger(release.id) || release.id <= 0) throw new Error('Missing release ID');
          await writeFile('release.json', JSON.stringify(release));
          await appendFile(output, `id=${release.id}\n`);
          RELEASE_SCRIPT

  build:
    if: ${{ inputs.finish_only != true }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SCREENTRANS_UPDATE_PUBLIC_KEY: ${{ vars.SCREENTRANS_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check out the release driver from the workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-driver
          sparse-checkout: /scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use the corrected driver when rebuilding an existing tag
        shell: bash
        run: |
          for file in tauri-v2.mjs tauri-build-output.mjs clean-v2-builds.mjs check-v2-version.mjs; do
            cp ".release-driver/scripts/$file" "scripts/$file"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libpipewire-0.3-dev libclang-dev libgbm-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm types:check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ needs.prepare.outputs.signed_updates == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }}
          includeUpdaterJson: ${{ needs.prepare.outputs.signed_updates == 'true' }}
          updaterJsonPreferNsis: true
  manifests:
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.signed_updates == 'true' && (needs.build.result == 'success' || (inputs.finish_only == true && needs.build.result == 'skipped')) }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check out the metadata driver from the workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-driver
          sparse-checkout: /scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use the corrected metadata driver for an existing tag
        run: cp .release-driver/scripts/v2-release-manifests.mjs scripts/v2-release-manifests.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and write signed update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          mkdir -p build/v2-release
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > build/v2-release/release.json
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern '*.sig' --dir build/v2-release
          node scripts/v2-release-manifests.mjs build/v2-release
          gh release upload "$RELEASE_TAG" build/v2-release/latest.json build/v2-release/latest-v2.json LICENSE docs/v2-third-party-notices.txt --clobber
