name: ScreenTranslate CI

on:
  push:
    branches: [main]
    paths: ['apps/**', 'crates/**', 'Cargo.*', 'rust-toolchain.toml', 'package.json', 'pnpm-*', 'scripts/**', '.github/workflows/v2-*.yml']
  pull_request:
    paths: ['apps/**', 'crates/**', 'Cargo.*', 'rust-toolchain.toml', 'package.json', 'pnpm-*', 'scripts/**', '.github/workflows/v2-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libpipewire-0.3-dev libclang-dev libgbm-dev tesseract-ocr tesseract-ocr-eng
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Actual Linux OCR fixture
        if: runner.os == 'Linux'
        run: cargo test -p screentrans-platform --test system_ocr --locked -- --ignored
      - run: pnpm types:check
      - run: pnpm check
      - run: pnpm test
      - run: node --test scripts/clean-v2-builds.test.mjs scripts/v2-release-manifests.test.mjs scripts/prepare-v2-release.test.mjs scripts/tauri-build-output.test.mjs scripts/v2-release-workflow.test.mjs
      - run: pnpm build
      - run: node scripts/measure-v2.mjs
      - name: Build desktop binary
        run: pnpm --filter @screentranslate/desktop tauri build --debug --no-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScreenTranslate-v2-${{ runner.os }}-debug
          path: |
            target/debug/screentranslate.exe
            target/debug/screentranslate
          if-no-files-found: error
