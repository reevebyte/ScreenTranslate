name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build native x64 executable
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build-native.ps1
          -Configuration Release
          -Architecture x64
          -RunSmokeTest
      - name: Validate native release binary
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\release\check_native_binary.ps1
          -Path .\build\native\Release\ScreenTranslate.exe
      - name: Upload unsigned native executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenTranslate-native-windows-x64-unsigned
          path: build/native/Release/ScreenTranslate.exe
          if-no-files-found: error
          retention-days: 14
